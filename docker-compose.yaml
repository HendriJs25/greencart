services:
  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - greencart-app-network
    environment:
      API_USER_SERVICE_HOST: user-service
      FRONTEND_HOST: frontend
    depends_on:
      user-service:
        condition: service_healthy
      frontend:
        condition: service_started

  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
      NUXT_API_USER_SERVER_BASE_URL: http://user-service:8001/api/v1/users
      NUXT_PUBLIC_API_USER_BASE_URL: /api/v1/users
      NUXT_PUBLIC_API_ORDER_BASE_URL: /api/v1
      NUXT_PUBLIC_API_PRODUCT_BASE_URL: /api/v1
      NUXT_PUBLIC_API_PAYMENT_BASE_URL: /api/v1
      NUXT_PUBLIC_API_NOTIFICATION_BASE_URL: /api/v1
    expose:
      - "3000"
    networks:
      - greencart-app-network

  user-service-db:
    image: postgres:18.6-alpine
    container_name: user-service-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: user_service_db
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_service_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - user-service-data:/var/lib/postgresql/
    networks:
      - greencart-data-network

  greencart-redis:
    image: redis:7-alpine
    container_name: greencart-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - greencart-redis-data:/data
    networks:
      - greencart-data-network

  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: "pGWHIqi8TFOB1aae9xF4yQ"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_LISTENERS: "INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:29093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:19092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

    networks:
      - greencart-data-network

  kafka_initializer:
    image: apache/kafka:4.4.0
    networks:
      - greencart-data-network
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |      
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:19092 \
          --create \
          --if-not-exists \
          --topic auth.email-verification.v1 \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=259200000
        
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:19092 \
          --create \
          --if-not-exists \
          --topic auth.forgot-password.v1 \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=259200000
        
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:19092 \
          --create \
          --if-not-exists \
          --topic customer.create-customer.v1 \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=259200000

        echo "Kafka topic initialized successfully"

  s3:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    command: ["/data"]
    ports:
      - "127.0.0.1:9273:9000"
      - "127.0.0.1:9274:9001"
    environment:
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: aws_user
      RUSTFS_SECRET_KEY: aws_password
      RUSTFS_REGION: ap-northeast-1
    volumes:
      - s3-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:9000/health >/dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  s3_initializer:
    image: public.ecr.aws/aws-cli/aws-cli:latest
    restart: "no"
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: aws_user
      AWS_SECRET_ACCESS_KEY: aws_password
      AWS_DEFAULT_REGION: ap-northeast-1
      AWS_EC2_METADATA_DISABLED: "true"
      S3_BUCKET: greencart-uploads
    entrypoint: [ "/bin/sh", "-ec" ]
    command:
      - |
        if aws --endpoint-url http://s3:9000 \
          s3api head-bucket \
          --bucket "$$S3_BUCKET" > /dev/null 2>&1; then

          echo "Bucket $$S3_BUCKET already exists"
        else
          aws --endpoint-url http://s3:9000 \
            s3api create-bucket \
            --bucket "$$S3_BUCKET"
    
          echo "Bucket $$S3_BUCKET created"
        fi

        cat > /tmp/bucket-policy.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "PublicReadProfileImages",
              "Effect": "Allow",
              "Principal": "*",
              "Action": "s3:GetObject",
              "Resource": "arn:aws:s3:::$$S3_BUCKET/users/*/profile/*"
            }
          ]
        }
        EOF

        aws --endpoint-url http://s3:9000 \
          s3api put-bucket-policy \
          --bucket "$$S3_BUCKET" \
          --policy file:///tmp/bucket-policy.json

        echo "S3 bucket and policy initialized successfully"

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: user-service
    stop_signal: SIGTERM
    stop_grace_period: 40s
    env_file:
      - ./services/user-service/.env
    depends_on:
      user-service-db:
        condition: service_healthy
      greencart-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      s3:
        condition: service_healthy
    networks:
      - greencart-app-network
      - greencart-data-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-o", "/dev/null", "http://127.0.0.1:8001/api/v1/users/healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s

volumes:
  user-service-data:
  greencart-redis-data:
  kafka-data:
  s3-data:

networks:
  greencart-app-network:
    driver: bridge
  greencart-data-network:
    driver: bridge
    internal: true
